<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Rail Fence Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h2 class="text-center font-weight-bold">RAIL FENCE CIPHER</h2>

        <h4 class="text-primary">ENCRYPTION</h4>
        <form method="POST" action="/encrypt_railfence">
            <div class="mb-3">
                <input type="text" name="inputPlainText" placeholder="Plain text" class="form-control" required>
            </div>
            <div class="mb-3">
                <input type="number" name="inputKey" placeholder="Key (number)" class="form-control" required>
            </div>
            <button class="btn btn-primary">Encrypt</button>
        </form>

        <h4 class="text-success mt-4">DECRYPTION</h4>
        <form method="POST" action="/decrypt_railfence">
            <div class="mb-3">
                <input type="text" name="inputCipherText" placeholder="Cipher text" class="form-control" required>
            </div>
            <div class="mb-3">
                <input type="number" name="inputKey" placeholder="Key (number)" class="form-control" required>
            </div>
            <button class="btn btn-success">Decrypt</button>
        </form>
    </div>
</body>

</html>
