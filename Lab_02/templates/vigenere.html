<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Vigenère Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h2 class="text-center font-weight-bold">VIGENÈRE CIPHER</h2>

        <!-- ENCRYPT -->
        <h4 class="text-primary mt-4">ENCRYPTION</h4>
        <form method="POST" action="/encrypt_vigenere">
            <div class="mb-3">
                <label class="form-label">Plain text:</label>
                <input type="text" class="form-control" name="inputPlainText" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Key:</label>
                <input type="text" class="form-control" name="inputKey" required>
            </div>
            <button type="submit" class="btn btn-primary">Encrypt</button>
        </form>

        <!-- DECRYPT -->
        <h4 class="text-success mt-5">DECRYPTION</h4>
        <form method="POST" action="/decrypt_vigenere">
            <div class="mb-3">
                <label class="form-label">Cipher text:</label>
                <input type="text" class="form-control" name="inputCipherText" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Key:</label>
                <input type="text" class="form-control" name="inputKey" required>
            </div>
            <button type="submit" class="btn btn-success">Decrypt</button>
        </form>
    </div>
</body>

</html>
